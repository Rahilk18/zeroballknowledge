<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232EE6FF'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2' stroke='%2300E5FF' stroke-width='1.5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZeroBallKnowledge – Football Arena | Real-time Multiplayer Auction Battle</title>
    <meta name="description" content="ZeroBallKnowledge – Real-time multiplayer football character-auction battle game." />

    <!-- Google Fonts: Rajdhani & Orbitron & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0A0A14;
        color: #F1F5F9;
        font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0A0A14;
        color: #FF4D6D;
        font-family: 'Rajdhani', system-ui, sans-serif;
        transition: opacity 350ms ease-out;
        z-index: 99999;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 5px;
        text-shadow: 0 0 16px rgba(255, 77, 109, 0.8), 0 0 32px rgba(255, 77, 109, 0.4);
      }
      #boot .sub {
        color: #64748B;
        font-size: 11px;
        letter-spacing: 3px;
        font-weight: 700;
      }
      #boot .ring {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 77, 109, 0.18);
        border-top-color: #FF4D6D;
        border-radius: 50%;
        animation: boot-spin 800ms linear infinite;
        box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0A0A14] text-slate-100 font-sans antialiased selection:bg-[#FF1744] selection:text-black min-h-screen">
    <div id="boot">
      <div class="ring"></div>
      <div class="mark">ZEROBALLKNOWLEDGE</div>
      <div class="sub">FOOTBALL REALM • INITIALIZING</div>
    </div>

    <div id="root"></div>

    <script>
      // HeroBid boot splash dismissal
      window.addEventListener('load', () => {
        setTimeout(() => {
          const boot = document.getElementById('boot');
          if (boot) {
            boot.classList.add('done');
            setTimeout(() => boot.remove(), 400);
          }
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
